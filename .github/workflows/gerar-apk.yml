name: Gerar APK Financeiro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: apk-financeiro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Recuperar chave de assinatura de teste
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: financeiro-debug-keystore-v1

      - name: Preparar assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" |
              base64 --decode > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=BR" \
              -noprompt
          fi

      - name: Gerar APK
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --console=plain \
            --stacktrace

      - name: Preparar arquivo para download
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk

          cp app/build/outputs/apk/debug/app-debug.apk \
            apk/Controle-Financeiro.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Controle-Financeiro-APK
          path: apk/Controle-Financeiro.apk
          if-no-files-found: error
          retention-days: 30
